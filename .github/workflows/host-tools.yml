name: host-tools

on:
  push:
    paths: ['tools/**', 'tests/**', 'xnu/patches/**', 'xnu/wcn3990/**', 'install-windows10.bat', '.github/workflows/host-tools.yml']
  pull_request:
    paths: ['tools/**', 'tests/**', 'xnu/patches/**', 'xnu/wcn3990/**', 'install-windows10.bat', '.github/workflows/host-tools.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/validate-repo.py
      - run: python3 -m unittest discover -s tests -v

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: clang --version
      - run: python -m unittest discover -s tests -p test_windows_installer.py -v
